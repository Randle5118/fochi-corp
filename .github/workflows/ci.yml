name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一ブランチへの連続 push では古い実行を打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # CLAUDE.md「変更後の検証（必須）」と同じ内容を CI でも強制する。
      # ビルドは環境変数なしで通る（RESEND_API_KEY は送信時に遅延検証されるため）。
      - run: npm run lint
      - run: npm run build
